name: Build MLBB Tool

on:
  push:
    branches: [ main, master ]
    paths:
      - 'SRC-MLBB-NUSANTARA/**'
      - 'dumper/**'
      - 'com.mobile.legends_64bit.cs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz (Mod menu ELF)
        run: |
          cd SRC-MLBB-NUSANTARA
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Build PanxczTool + PanxczOverlay
        run: |
          cd dumper/app/src/main/jni
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          cp SRC-MLBB-NUSANTARA/libs/arm64-v8a/panxcz release/ 2>/dev/null || true
          cp dumper/app/src/main/jni/libs/arm64-v8a/PanxczTool release/ 2>/dev/null || true
          cp dumper/app/src/main/jni/libs/arm64-v8a/libPanxczOverlay.so release/ 2>/dev/null || true
          chmod 755 release/panxcz release/PanxczTool 2>/dev/null || true
          chmod 644 release/libPanxczOverlay.so 2>/dev/null || true
          cp com.mobile.legends_64bit.cs release/dump.cs 2>/dev/null || true
          cp SRC-MLBB-NUSANTARA/jni/src/Includes/Offset.h release/ 2>/dev/null || true
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-tool
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: "Panxcz MLBB NUSANTARA v2.1"
          body: |
            ## Panxcz MLBB NUSANTARA v2.1

            ### HOTFIX — CRASH PAS MASUK MATCH (exit sendiri)
            - **Akar masalah**: `RoomInfoList()` dipanggil tiap frame di main loop & melakukan deref LANGSUNG `*(String**)(game_addr)` — tool ini EKSTERNAL (baca via `process_vm_readv`), jadi alamat di address space game tidak valid di proses tool → SIGSEGV begitu BattleManager valid (in-match) → proses exit sendiri.
            - **Fix**: pemanggilan `RoomInfoList()` di-nonaktifkan (hasilnya `PlayerB/PlayerR` memang tidak pernah ditampilkan di UI versi ini) + implementasi fungsi diperbaiki jadi remote-read (`Read` + `fshy`) kalau suatu saat dipakai lagi.
            - **Anti-gila loop**: player count & monster count di-clamp (64/128) kalau kebaca sampah.
            - **Zero-init posisi**: `Vector3 Z/D/ZL/Dm` di-inisialisasi 0 sebelum `vm_readv` (kalau baca gagal, posisi tidak jadi NaN/garbage).

            ### MAJOR — UPDATE TOTAL (v1.10 -> v2.0)
            - **Offset game di-update ke dump 22.1.97.12061** (sebelumnya v2.1.95 yg sudah obsolete) → BattleManager sekarang ketemu langsung via chain `slot -> +0xa8 -> Instance`, fallback ke memory scanner kalau beda versi.
            - **Touch helper universal** (sama dgn srcshen v1.0): scan `/dev/input` NULL-safe + fallback `/proc/bus/input/devices`, `block_untrusted_touches 0` otomatis (Android 12+/AOSP 16), uinput dibuat DULU baru grab device (kalau uinput gagal, layar sentuh game TETAP normal), slot 12 dedicated utk tap sintetik, kalibrasi 1-tap (Set Dot).
            - **Auto Retri fix**: jarak max pakai `RETRI_MAX_DISTANCE 700` unit dunia (range retri asli MLBB) — sebelumnya hardcode `>5.0` yg bikin retri GA PERNAH kepencet kecuali monster nempel.
            - **Posisi dot retri proporsional ke layar** (0.64W, 0.61H) — support semua resolusi HP, bukan hardcode 2460x1080.
            - **Minimap fix**: bidang horizontal X/Y dunia (sebelumnya pakai Z yg bikin ikon minimap ga sinkron sama gerakan player).
            - **Kill Steal Alert DIIMPLEMENTASI beneran**: alert + penanda di atas kepala musuh saat HP < threshold (sebelumnya cuma deklarasi).
            - **Show Spell CD DIIMPLEMENTASI beneran**: 3 dot (S1/S2/ULT) di atas musuh — hijau=ready, merah=sisa detik (sebelumnya cuma checkbox kosong).
            - **Room Info fix**: camp pakai `m_EntityCampType` (0xd0), battle spell pakai `m_iSummonSkillId` (0x95c) — sebelumnya offset salah.
            - **fshy di-clamp 255** (anti buffer overflow dari string sampah).
            - **`native_window_screen_y` = MIN** (dulu MAX → surface lebih tinggi dari layar).
            - **Touch status live** di tab Retri (OK/FAILED + statistik mirror/tap + errno) + tombol **Set Dot** & **Test Tap**.

            ### Files
            | File | Type | Fungsi |
            |------|------|--------|
            | `PanxczTool` | ELF executable | Process list + inject .so ke game |
            | `libPanxczOverlay.so` | Shared library | ImGui overlay (di-load ke game) |
            | `panxcz` | ELF executable | Mod menu (ESP + Retri + Combat + Minimap) |
            | `dump.cs` | Dump reference | Offset & kelas utk update berikutnya |
            | `Offset.h` | Offset header | Versi terbaru (22.1.97.12061) |

            ### Cara Pakai

            ```bash
            # 1. Push ke device
            adb push PanxczTool /data/local/tmp/
            adb push libPanxczOverlay.so /data/local/tmp/

            # 2. Set permission
            adb shell chmod 777 /data/local/tmp/PanxczTool

            # 3. Buka game dulu (MLBB)

            # 4. Jalankan PanxczTool (bisa via MT Manager!)
            adb shell
            su -c /data/local/tmp/PanxczTool
            ```

            ### Bisa buka di MT Manager
            Buka `PanxczTool` via MT Manager → pilih PID → Inject!

            ### Requirements
            - Rooted Android (arm64)
            - Game running
            - `libPanxczOverlay.so` di `/data/local/tmp/`

            **Educational purposes only.**
          files: release/*
          fail_on_unmatched_files: false
