name: Build MLBB Tool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21 (matches herz-kimmy.sh compatibility)
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz (ELF binary)
        run: |
          cd SRC-MLBB-NUSANTARA
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Check output
        run: |
          echo "=== Built files ==="
          find . -name "panxcz" -o -name "libpanxcz.so" | head -5
          find . -path "*/arm64-v8a/panxcz" -exec file {} \;

      - name: Package
        run: |
          mkdir -p release
          cp SRC-MLBB-NUSANTARA/libs/arm64-v8a/panxcz release/ 2>/dev/null || true
          cp com.mobile.legends_64bit.cs release/dump.cs
          cp SRC-MLBB-NUSANTARA/jni/src/Includes/Offset.h release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-tool
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9
          name: "MLBB External Tool v1.9"
          body: |
            ## MLBB External Tool v1.9
            
            Retribution auto + ESP for Mobile Legends.
            
            ### Changes
            - **Android 16 support** — added patchesTable entry for version 16
            - Fixes SIGSEGV on Android 16 AOSP ROMs
            - NDK r21 compatibility (same as herz-kimmy.sh)
            - Black Obsidian ImGui theme
            - Auto Retri with priority modes
            - ESP, KDA, Kill Steal Alert
            
            ### How to use
            1. Push `panxcz` to device
            2. Run with root: `su -c ./panxcz`
            3. Open ImGui menu in-game
            
            ### Requirements
            - Rooted Android (arm64)
            - MLBB running
            
            **Educational purposes only.**
          files: release/*
          fail_on_unmatched_files: false
