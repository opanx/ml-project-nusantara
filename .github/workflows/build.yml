name: Build MLBB Tool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz (Mod menu ELF)
        run: |
          cd SRC-MLBB-NUSANTARA
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Build libPanxczOverlay.so
        run: |
          cd dumper/app/src/main/jni
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          cp SRC-MLBB-NUSANTARA/libs/arm64-v8a/panxcz release/ 2>/dev/null || true
          cp dumper/app/src/main/jni/libs/arm64-v8a/libPanxczOverlay.so release/ 2>/dev/null || true
          chmod 755 release/panxcz 2>/dev/null || true
          chmod 644 release/libPanxczOverlay.so 2>/dev/null || true
          cp com.mobile.legends_64bit.cs release/dump.cs 2>/dev/null || true
          cp SRC-MLBB-NUSANTARA/jni/src/Includes/Offset.h release/ 2>/dev/null || true
          echo "=== Release ==="
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-tool
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.16
          name: "Panxcz Tool v1.16"
          body: |
            ## Panxcz Tool v1.16

            ### Files
            - `panxcz` — Mod menu (ImGui + ESP + Retri)
            - `libPanxczOverlay.so` — **Overlay .so** (injected into game)

            ### How to use libPanxczOverlay.so

            **Method 1: LD_PRELOAD**
            ```
            adb push libPanxczOverlay.so /data/local/tmp/
            adb shell
            su -c "LD_PRELOAD=/data/local/tmp/libPanxczOverlay.so am start -n com.mobile.legends/com.mobile.legends.MainActivity"
            ```

            **Method 2: inject / vulcan / any injector**
            ```
            adb push libPanxczOverlay.so /data/local/tmp/
            adb shell
            su -c "chmod 755 /data/local/tmp/libPanxczOverlay.so"
            # Use your injector to load libPanxczOverlay.so into the game process
            ```

            **Method 3: game guardian style**
            ```
            # Load libPanxczOverlay.so into running game process
            su -c "cat /data/local/tmp/libPanxczOverlay.so > /proc/<PID>/fd/..."
            ```

            ### Features (when loaded into game)
            - ImGui overlay with full menu
            - IL2CPP Dumper
            - Method tracer, strings viewer
            - Dobby + Frida hooking

            ### Requirements
            - Rooted Android (arm64)
            - Game must be running

            **Educational purposes only.**
          files: release/*
          fail_on_unmatched_files: false
