name: Build MLBB Tool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21 (matches herz-kimmy.sh compatibility)
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz (ELF binary)
        run: |
          cd SRC-MLBB-NUSANTARA
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Build panxcz_dumper (External from Android-LibTool-New)
        run: |
          cd dumper/app/src/main/jni
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            -j$(nproc)

      - name: Check output
        run: |
          echo "=== Built files ==="
          find . -name "panxcz" -o -name "libTool.so" | head -10
          find . -path "*/arm64-v8a/panxcz" -exec file {} \;
          find . -path "*/arm64-v8a/libTool.so" -exec file {} \;

      - name: Package
        run: |
          mkdir -p release
          cp SRC-MLBB-NUSANTARA/libs/arm64-v8a/panxcz release/ 2>/dev/null || true
          # Rename libTool.so to panxcz_tool executable
          cp dumper/app/src/main/jni/libs/arm64-v8a/libTool.so release/panxcz_tool 2>/dev/null || true
          chmod 755 release/panxcz release/panxcz_tool 2>/dev/null || true
          cp com.mobile.legends_64bit.cs release/dump.cs
          cp SRC-MLBB-NUSANTARA/jni/src/Includes/Offset.h release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-tool
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12
          name: "MLBB External Tool v1.12"
          body: |
            ## MLBB External Tool v1.12
            
            ### Binaries
            - `panxcz` — Mod menu (ImGui overlay) + Auto Retri + ESP
            - `panxcz_dumper` — External IL2CPP dumper (chmod 777)
            
            ### panxcz_dumper Features
            - Reads game memory via /proc/pid/mem
            - Scans for IL2CPP metadata (magic 0xFAB11BAF)
            - Multi-strategy scan (library sections → anonymous → all)
            - Outputs dump.cs to /sdcard/Download/
            - No ImGui, no overlay — pure CLI
            
            ### panxcz (Mod Menu)
            - BattleManager memory scanner
            - Android 16 support
            - NDK r21 compatibility
            
            ### How to use dumper
            ```
            adb push panxcz_dumper /data/local/tmp/
            adb shell
            chmod 777 /data/local/tmp/panxcz_dumper
            su -c /data/local/tmp/panxcz_dumper
            adb pull /sdcard/Download/dump_com.mobile.legends.cs
            ```
            
            ### How to use
            1. Push `panxcz` to device
            2. Run with root: `su -c ./panxcz`
            3. Open ImGui menu in-game
            
            ### Requirements
            - Rooted Android (arm64)
            - MLBB running
            
            **Educational purposes only.**
          files: release/*
          fail_on_unmatched_files: false
