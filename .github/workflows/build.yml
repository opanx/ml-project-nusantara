name: Build MLBB Tool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21 (matches herz-kimmy.sh compatibility)
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz (ELF binary)
        run: |
          cd SRC-MLBB-NUSANTARA
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Build panxcz_dumper (External from Android-LibTool-New)
        run: |
          cd dumper/app/src/main/jni
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)

      - name: Check output
        run: |
          echo "=== Built files ==="
          find . -name "panxcz" -o -name "Tool" | head -10
          find . -path "*/arm64-v8a/panxcz" -exec file {} \;
          find . -path "*/arm64-v8a/Tool" -exec file {} \;

      - name: Package
        run: |
          mkdir -p release
          cp SRC-MLBB-NUSANTARA/libs/arm64-v8a/panxcz release/ 2>/dev/null || true
          # Rename libTool.so to panxcz_tool executable
          cp dumper/app/src/main/jni/libs/arm64-v8a/Tool release/panxcz_tool 2>/dev/null || true
          chmod 755 release/panxcz release/panxcz_tool 2>/dev/null || true
          cp com.mobile.legends_64bit.cs release/dump.cs
          cp SRC-MLBB-NUSANTARA/jni/src/Includes/Offset.h release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-tool
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14
          name: "MLBB External Tool v1.13"
          body: |
            ## MLBB External Tool v1.13
            
            ### Binaries
            - `panxcz` — Mod menu (ImGui overlay) + Auto Retri + ESP
            - `panxcz_tool` — Android-LibTool-New compiled as ELF executable (chmod 777)
            
            ### panxcz_tool Features (from Android-LibTool-New)
            - IL2CPP Dumper (dump.cs)
            - ImGui overlay with full menu
            - Method tracer, strings viewer, class browser
            - Frida + Dobby hooking support
            - Default target: liblogic.so (MLBB)
            
            ### How to use
            ```
            adb push panxcz_tool /data/local/tmp/
            adb shell
            chmod 777 /data/local/tmp/panxcz_tool
            su -c /data/local/tmp/panxcz_tool
            ```
            
            ### Requirements
            - Rooted Android (arm64)
            - MLBB running
            
            **Educational purposes only.**
          files: release/*
          fail_on_unmatched_files: false
