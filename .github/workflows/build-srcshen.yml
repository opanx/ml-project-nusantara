name: Build Panxcz cheat mlbb (srcshen)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcshen/**'
      - 'com.mobile.legends_22.1.97.12061.cs'
      - '.github/workflows/build-srcshen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz_mlbb (ELF arm64)
        run: |
          cd srcshen
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          cp srcshen/libs/arm64-v8a/panxcz_mlbb release/panxcz_mlbb 2>/dev/null || true
          chmod 755 release/panxcz_mlbb 2>/dev/null || true
          cp com.mobile.legends_22.1.97.12061.cs release/dump_22.1.97.12061.cs 2>/dev/null || true
          ls -la release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-mlbb
          path: release/

      - name: Create pre-release v0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3
          name: "Panxcz cheat mlbb v0.3 pre release"
          prerelease: true
          body: |
            ## Panxcz cheat mlbb v0.3 pre release

            ### File
            | File | Type | Keterangan |
            |------|------|------------|
            | `panxcz_mlbb` | ELF executable (arm64) | Cheat MLBB terbaru (ESP + Auto Retri + Minimap + Drone View) |
            | `dump_22.1.97.12061.cs` | Dump reference | Offsets & kelas untuk update berikutnya |

            ### Fix v0.2 -> v0.3
            - **Touch passthrough di-rework jadi verbatim mirror** - event sentuh asli (ABS_MT_SLOT, TRACKING_ID, urutan & timing driver) diteruskan apa adanya ke game, bukan di-rebuild ulang. Gesture MLBB kayak quick emote & slide chat sekarang terdeteksi natural, latensi input turun drastis
            - **uinput clone sekarang support ABS_MT_SLOT** biar multitouch & gesture tetap utuh saat mirror
            - **Auto Retri lebih pintar** - kalau tap pertama meleset (button CD / posisi bergeser / target sembuh), auto retry tiap interval sampai target mati
            - **Damage retri bisa dikoreksi** - slider Dmg Bonus kalau angka formula beda sama damage asli di versi game lo
            - **Info live di tab Auto Retri** - tampil damage retri sekarang (Lv + jungle kills), jumlah monster yang bisa langsung dibunuh, Hold ms, Retry interval, Max Distance
            - **Tombol minimize/exit lebih gede** (52x38) biar gampang disentuh
            - **Volume − = minimize menu | Volume + = expand** (tanpa ganggu volume sistem; ESP/minimap tetap jalan saat menu collapsed)

            ### Fix v0.1 -> v0.2 (sebelumnya)
            - Crash boot (Aborted 134 / Pointer tag truncated) - pointer di-untag sebelum process_vm syscall
            - Bug write memory pvm 4-arg (sekarang benar SYS_process_vm_writev)
            - Ukuran overlay & math minimap (bidang X/Z benar) + kalibrasi live + marker player sendiri
            - Init overlay jalur yang terbukti boot

            ### Offset Source
            - Di-update berdasarkan dump resmi **MLBB 22.1.97.12061**
            - `ShowEntity` / `ShowPlayer` / `BattleManager` / `GameMethod` / `CoolDownData` diverifikasi langsung dari dump

            ### Cara Pakai (MT Manager / Terminal root)
            ```bash
            # Copy ke device root
            su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"
            ```

            ### Fitur
            - ESP Player (line, icon hero, HP bar, MP bar, skill CD musuh)
            - ESP Monster/Minion + alert Lord/Turtle diserang
            - Auto Retribution (Lord/Turtle/Buff/Crab/Lito) + set posisi tombol
            - Minimap ESP (icon hero + marker sendiri + ring merah)
            - Drone View (FOV camera)
            - Multi theme (Neon Dark / Light / Classic), EN + 中文

            **Educational purposes only.** By Panxcz & Freebuff.
          files: release/*
          fail_on_unmatched_files: false
