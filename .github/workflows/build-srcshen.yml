name: Build Panxcz cheat mlbb (srcshen)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcshen/**'
      - 'com.mobile.legends_22.1.97.12061.cs'
      - '.github/workflows/build-srcshen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz_mlbb (ELF arm64)
        run: |
          cd srcshen
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          cp srcshen/libs/arm64-v8a/panxcz_mlbb release/panxcz_mlbb 2>/dev/null || true
          chmod 755 release/panxcz_mlbb 2>/dev/null || true
          cp com.mobile.legends_22.1.97.12061.cs release/dump_22.1.97.12061.cs 2>/dev/null || true
          ls -la release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-mlbb
          path: release/

      - name: Create pre-release v0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2
          name: "Panxcz cheat mlbb v0.2 pre release"
          prerelease: true
          body: |
            ## Panxcz cheat mlbb v0.2 pre release

            ### File
            | File | Type | Keterangan |
            |------|------|------------|
            | `panxcz_mlbb` | ELF executable (arm64) | Cheat MLBB terbaru (ESP + Auto Retri + Minimap + Drone View) |
            | `dump_22.1.97.12061.cs` | Dump reference | Offsets & kelas untuk update berikutnya |

            ### Fix v0.1 -> v0.2
            - **Crash boot (Aborted 134 / Pointer tag truncated)** - pointer hasil baca dari memori game sekarang di-untag (mask top byte) sebelum dikirim ke syscall process_vm - ROM AOSP 16 pakai tagged pointers
            - **Bug write memory** - pvm 4-arg sekarang benar pakai SYS_process_vm_writev saat iswrite=true (dulu selalu readv - Drone View FOV write tidak pernah jalan)
            - **Ukuran overlay** - native_window_screen_y sekarang pakai dimensi MIN (dulu MAX - surface lebih tinggi dari layar)
            - **Minimap tidak sinkron** - math WorldToMinimap sekarang pakai bidang horizontal X/Z yang benar (dulu nyampur sumbu vertikal Y-up)
            - **Kalibrasi minimap live** - slider Angle / X-Mult / Y-Mult / Off X / Off Y / Scale + Pos Y + Icon Size
            - **Marker player sendiri (hijau)** di minimap - biar mudah verifikasi sinkronisasi
            - **Tombol minimize (-)** - menu bisa di-collapse jadi pill kecil, overlay ESP tetap jalan
            - **Tombol exit (x)** di header menu
            - Init overlay memakai jalur yang terbukti boot (print tiap langkah, no prompt, guard null window)

            ### Offset Source
            - Di-update berdasarkan dump resmi **MLBB 22.1.97.12061**
            - `ShowEntity` / `ShowPlayer` / `BattleManager` / `GameMethod` / `CoolDownData` diverifikasi langsung dari dump

            ### Cara Pakai (MT Manager / Terminal root)
            ```bash
            # Copy ke device root
            su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"
            ```

            ### Fitur
            - ESP Player (line, icon hero, HP bar, MP bar, skill CD musuh)
            - ESP Monster/Minion + alert Lord/Turtle diserang
            - Auto Retribution (Lord/Turtle/Buff/Crab/Lito) + set posisi tombol
            - Minimap ESP (icon hero + marker sendiri + ring merah)
            - Drone View (FOV camera)
            - Multi theme (Neon Dark / Light / Classic), EN + 中文

            **Educational purposes only.** By Panxcz & Freebuff.
          files: release/*
          fail_on_unmatched_files: false
