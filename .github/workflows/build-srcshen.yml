name: Build Panxcz cheat mlbb (srcshen)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcshen/**'
      - 'com.mobile.legends_22.1.97.12061.cs'
      - '.github/workflows/build-srcshen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK r21
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz_mlbb (ELF arm64)
        run: |
          cd srcshen
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          cp srcshen/libs/arm64-v8a/panxcz_mlbb release/panxcz_mlbb 2>/dev/null || true
          chmod 755 release/panxcz_mlbb 2>/dev/null || true
          cp com.mobile.legends_22.1.97.12061.cs release/dump_22.1.97.12061.cs 2>/dev/null || true
          cp srcshen/BYPASS.md release/BYPASS.md 2>/dev/null || true
          ls -la release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: panxcz-mlbb
          path: release/

      - name: Bersihkan asset stale di release (kalau tag dipakai ulang)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hapus asset lama yang nyangkut (panxcz/dump.cs/Offset.h dari build lain)
          # supaya release srcshen cuma berisi panxcz_mlbb + dump_22.1.97.12061.cs
          REL="v1.15"
          if gh release view "$REL" --json tagName -q .tagName >/dev/null 2>&1; then
            for NAME in panxcz dump.cs Offset.h; do
              ID=$(gh api "repos/${{ github.repository }}/releases/tags/$REL" --jq ".assets[] | select(.name==\"$NAME\") | .id" 2>/dev/null)
              if [ -n "$ID" ]; then
                echo "menghapus asset stale: $NAME ($ID)"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ID" || true
              fi
            done
          fi

      - name: Create pre-release v1.15
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.15
          name: "Panxcz cheat mlbb v1.15 pre release (retri balik cara v0.3: native SetDot dulu)"
          prerelease: true
          body: |
            ## Panxcz cheat mlbb v1.15 pre release (retri balik cara v0.3: native SetDot dulu)

### 🔧 v1.15 - retri balik ke cara v0.3/herz yg terbukti:
- retriX/Y/native ga di-persist lagi (cfg lama bikin dot nyangkut (1551,968) -> tap meleset). Default selalu proporsional 64%/61% (~1575,661) persis v0.3.
- Jalur tap: direct-call > native SetDot (ground truth) > default logical (konversi v0.3). Screen-map/DotToNative v1.9 dihapus dari jalur auto (sering salah pilih rotasi -> tap meleset 90 derajat walau dot keliatan bener).
- Set Dot sekarang jadi satu-satunya kalibrasi: ketuk tombol retri sekali -> native disimpan -> tap retri pakai native itu persis.

---

## Panxcz cheat mlbb v1.14 pre release (tap sinkron stream driver asli)

            ### 🔬 Hasil studi touch herz-kimmy / The Ruler / PRIMEBIT:
            - **PRIMEBIT-KERNEL**: ga punya touch sintetik sama sekali (murni room-info/ESP, EGL-only). Bukan patokan touch.
            - **herz & The Ruler (yg work)**: arsitekturnya SAMA PERSIS dgn kita - uinput clone + grab device asli + mirror + `settings put system/global/secure block_untrusted_touches 0` + `Transaction::setTrustedOverlay` via dlsym. Semua itu udah ada di tool kita sejak v1.8+.
            - Bedanya di **bentuk event tap**: driver asli (mtk-tpd) selalu kirim `ABS_MT_PRESSURE` + `ABS_MT_TOUCH_MAJOR` saat jari nempel. Tap sintetik kita cuma kirim XY+tracking - bentuk stream beda dari driver asli -> InputReader/anti-cheat berpotensi anggap aneh.

            ### 🔧 Fix di v1.14 (guard aman, beda dari percobaan v1.9):
            - Tap DOWN sekarang kirim `ABS_MT_PRESSURE` + `ABS_MT_TOUCH_MAJOR` **hanya kalau device asli beneran punya axis itu** (di-copy range aslinya di FASE 2). Nilai pressure = 60% range (kayak tap beneran).
            - v1.9 gagal karena kirim axis tanpa guard -> bisa -EINVAL/aneh di kernel. Sekarang axis cuma dikirim kalau uinput-nya ke-register axis itu.
            - Urutan event tap disamain dgn driver type-B: slot -> tracking -> pressure/major -> X/Y -> SYN_MT_REPORT -> BTN -> SYN_REPORT.

            ### ⚠️ Catatan jujur:
            - Verifikasi kiriman event di kernel (lewat node evdev sendiri) di sandbox **tidak teramati** - write tap diterima penuh kernel (240B/144B errno=0) tapi echo ke pembaca evdev baru kosong (perilaku kernel/MTK: event di-fan-out ke client yg udah nempel sejak awal, InputReader).
            - Karena itu keputusan final tetep dari test in-game: buka MLBB -> jalanin -> centang Auto Retri -> geser dot ke tombol retri -> Test Tap -> liat `✓ HP turun` / `✗`.

            ---

            ## Panxcz cheat mlbb v1.13 pre release (fix device discovery toleran type-A)

            ### 🔧 Fix di v1.13:
            - Deteksi toleran type-A (slot opsional) + prioritas berlapis RW+slot > RW+no-slot > RO+slot > RO+no-slot + maxE 5->16 + diagnosa jumlah node kebuka/ditolak.

            ---

            ## Panxcz cheat mlbb v1.12 pre release (fix Touch_Init: RO/grabless fallback)

            ### 🔧 Fix di v1.12:
            - Fallback READ-ONLY (mode GRABLESS) kalau /dev/input nolak O_RDWR + diagnostik
              errno + baris init `mode=GRAB/GRABLESS` + panel Skill CD di bawah bar HP/MP.

            ---

            ## Panxcz cheat mlbb v1.11 pre release (observability)

            ### 🔬 STUDI HERZ-KIMMY SAMPAI AKAR + STATUS YANG SEKARANG KELIHATAN (v1.11)
            Setelah bedah binary herz-kimmy sampe dalem (DT_NEEDED, symbol, event touch, surface):
            - **Arsitektur herz = arsitektur kita**: herz cuma linked ke libandroid+EGL, symbol SurfaceFlinger (createSurface/Transaction/setTrustedOverlay) di-resolve runtime via dlsym — persis ANWC kita. Overlay = surface tersembunyi via SF + EGL, input = grab device asli + uinput clone + mirror, ImGui di-feed langsung dari event asli.
            - **herz juga pake `Transaction::setTrustedOverlay`** (surface di-trust) + `block_untrusted_touches 0` — kita juga udah punya kode yang sama, TAPI selama ini **ga kelihatan resolve apa nggak**. Mulai v1.11:
              - `[+] TRUSTED OVERLAY: OK` → surface ke-trust, touch game ga diblokir
              - `[-] TRUSTED OVERLAY: GAGAL resolve` → ini yang bikin tap sintetik bisa diblokir MLBB/Aegis
            - **Baris baru di startup**: `Screen: ... (displayInfo ... orient=N)` dan `[TOUCH] init OK ... orient=N scale=X/Y` → nentuin mapping koordinat bener/salah dalam satu liat.
            - Fitur inti lain sudah setara: event tap DOWN (ABS_X/Y + POS + TRACKING_ID + SYN_MT_REPORT + BTN), watchdog `block_untrusted_touches`, verifikasi HP abis tap (`✓`/`✗`), screen-map dot→native.

            ### Cara baca hasil test (penting!):
            1. Banner `PANXCZ MLBB v1.11`
            2. Catat baris: `TRUSTED OVERLAY: OK/GAGAL`, `Screen ... orient=N`, `[TOUCH] init OK ... orient=N scale=X/Y`
            3. Sentuh menu → harus ada `sentuhan asli diterima` + `realtouch` nambah di baris DBG
            4. Report 3 baris itu ke gw → langsung ketahuan akar masalahnya (trusted overlay gagal / orientasi mapping salah / input mati).

            ---

            ## Panxcz cheat mlbb v1.10 pre release (fix menu touch + anti-numpuk CD)

            ### 🖐️ MENU GA BISA DISENTUH DI v1.9? INI HOTFIX (v1.10)
            - **v1.9 nyoba nambahin `ABS_MT_PRESSURE`/`TOUCH_MAJOR`** di tap sintetik (percobaan biar MTK ga nganggap tap hantu) — ternyata bikin **menu jadi ga bisa disentuh** di device lo. **Di-revert total** di v1.10 → balik ke format tap v1.8 yang terbukti.
            - **Telemetri sentuhan asli**: sekarang console nampilin `realtouch=N` di baris DBG + print sekali `sentuhan asli diterima -> ImGui bisa di-klik` pas jari pertama nyentuh layar. Kalau menu masih ga bisa disentuh di v1.10, baris ini nentuin masalahnya di jalur mana: `realtouch` nambah tapi menu mati = masalah di ImGui; `realtouch` tetap 0 = masalah di grab/read device.
            - **Anti-numpuk tulisan CD**: pas war/cluster, panel skill CD (S1/S2/ULT + angka) hero yang posisinya mepet sekarang di-skip → tulisan ga numpuk jadi gado-gado.

            ---

            ## Panxcz cheat mlbb v1.9 pre release (screen-map dot->native + verifikasi tap)

            ### 🎯 AKAR MASALAH RETRI "TAP JALAN TAPI GA NGE-CAST" (v1.9)
            - **Bug utama**: kalibrasi lama nyimpen koordinat `native` mentah di config. Pas user geser dot (X/Y slider), yang ke-tap TETAP native lama → kelihatan "dot udah dipindah tapi retri ga pernah kepencet".
            - **Fix**: sekarang ada **screen-map** — pas "Set Dot" (ketuk tombol retri ASLI), tool nyimpen pasangan (posisi dot di layar ↔ koordinat panel sentuh). Dari 1 titik itu, 8 kandidat transform (rotasi 90°/mirror) di-solve otomatis. Efeknya **tap SELALU ngikutin posisi dot** yang bisa digeser live pake X/Y → geser dot pas di tombol retri = tap pas di tombol retri.
            - **Nyaring cfg native stale**: kalau native dari config lama di luar panel device sekarang, otomatis diabaikan + disuruh Set Dot ulang (ga ada lagi koordinat HP lain nyangkut).
            - **Verifikasi objektif**: abis tiap tap auto-retri, tool baca ulang HP target ~0.5 detik kemudian → console nampilin `✓ HP turun` (retri kena) atau `✗ HP masih sama` (geser dot / retri lagi CD). Ga perlu nebak lagi.
            - **Tap sintetik makin mirip jari asli**: sekarang ikut ngirim `ABS_MT_PRESSURE` + `ABS_MT_TOUCH_MAJOR` (kalau device asli punya) — biar MTK/game ga nganggep sentuhan sintetik itu "hantu".

            ### Cara test v1.9 (satu sesi, hasil langsung keliatan):
            1. `su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"` → banner harus `PANXCZ MLBB v1.9`.
            2. Masuk match, tab Auto Retri → centang Auto Retri (semua target ikut ON).
            3. **Geser dot (X/Y) sampe lingkaran putih PERSIS nutupin tombol retri di layar.**
            4. Tombol " Test Tap " → liat console: harus nampilin `✓ HP turun` kalau kena. Kalau `✗ HP masih sama`, geser dot dikit lagi + test lagi (dot sekarang beneran ngontrol titik tap).

            ---

            ## Panxcz cheat mlbb v1.8 pre release (CD auto-sync + auto retri fix)

            ### 🔧 SKILL CD — DETEKSI OTOMATIS CARA HITUNG GAME (v1.8)
            - **Angka CD sekarang sinkron otomatis**: ada game/ROM yg ngisi `uiCoolTime` sebagai DURASI tetap (sisa = durasi - elapsed), ada juga yg ngisi SISA yg di-update tiap frame (sisa = field langsung). Sebelumnya kode cuma punya satu cara hitung → angka turun dobel-cepet / nyangkut di 1 / ga nyambung sama CD asli.
            - **Fix**: deteksi otomatis dari 2 poll beruntun — kalau `uiCoolTime` turun seiring wall-clock (kecepatan sama), tool otomatis pakai mode live; kalau konstan, pakai mode durasi-fixed. Nggak ada lagi angka ngawur.
            - **Anchor anti-restart**: `uiStartTime` yang berubah kecil (drift) ga bikin countdown restart; baru di-reset kalau start loncat jauh (skill beneran dipake ulang).

            ### ⚡ AUTO RETRI — SEKARANG LANGSUNG KERJA (v1.8)
            - **Bug**: toggle utama "Aktifkan Auto Retri" ON tapi semua target (Lord/Turtle/Crab/Buff/Lito) default MATI → tool keliatan nyala tapi ga ngapa-ngapain.
            - **Fix 1**: centang Auto Retri → semua target otomatis ikut ON.
            - **Fix 2**: kalau ternyata ga ada satu pun target yg aktif (sisa cfg lama), semua target dianggap aktif → auto retri tetep jalan.

            ### 🛡️ DIRECT CALL — GA SPAM LAGI + AUTO-FALLBACK TOUCH (v1.8)
            - Gagal install cuma di-print 2x, abis itu **otomatis mati + pesan sekali** kalau device ga mendukung (ga ada region exec yg bisa ditulis). Sisanya auto retri pakai touch yg udah jalan.

            ### 🧹 LAINNYA (v1.8)
            - Spam `[ANWC] NOT FOUND ...` di console dihilangkan (tetap ke logcat) — console bersih.
            - Actions di-upgrade (checkout v7, setup-android v4, upload-artifact v7, gh-release v3) — hilangkan warning Node 20 deprecated.

            ### HOTFIX SEBELUMNYA (v1.7) — SKILL CD DI-POLL SEMUA HERO
            - CD di-poll tiap frame utk SEMUA hero hidup (bukan cuma di layar) → anchor ke-set pas skill dipake di mana pun.
            - Hapus bug restart-penuh; dot balik hijau pas entry ilang dari dictionary game.

            ### HOTFIX (v1.6) — RETRI TOUCH DITOLAK SISTEM (errno=38 ENOSYS)
            - Watchdog re-disable `block_untrusted_touches` tiap 1.5s + retry tap + counter `fails` live.
            - Direct call: install sekali per match (backoff) + fallback PTRACE poke di ROM tanpa RWX.

            ### 🛡️ DIRECT CALL BYPASS (v1.5)
            - Engine `RemoteCall.h`: panggil cast retri langsung di proses game via signal trampoline (tanpa ptrace saat main, tanpa patch .so, tanpa thread baru). Detail: **BYPASS.md**.

            ### HOTFIX — LAYOUT SKILL CD + MAPPING SLOT (v1.2)
            - **CD dipindah ke KANAN hero** (kolom terpisah dari bar HP/MP) — sebelumnya dot & angka CD numpuk di area bar + semua angka di satu titik → susah dibedain.
            - **Tiap skill punya kolom sendiri**: label S1/S2/ULT + dot (hijau=ready, merah=CD) + angka sisa CD di bawah dot-NYA masing-masing.
            - **Mapping slot akurat**: pakai `_dicSkillCnf` (daftar skill asli hero) biar spell yang lagi CD ke-taruh di kolom yang bener (dulu kalau cuma ULT yg CD, ke-label S1).


            ### CATATAN VERSI
            - **Yang bener buat di-download: `panxcz_mlbb`** (bukan `panxcz` — itu punya build NUSANTARA/rilis lain).

            ### HOTFIX — SKILL CD GA KELIATAN (v1.1)
            - **Akar masalah**: sisa CD dihitung pakai `time(nullptr)*1000` (epoch wall-clock ~1.7 triliun) padahal `uiStartTime/uiCoolTime` itu **jam internal battle** (nilai kecil). `elapsed = now - startTime` selalu raksasa → sisa selalu 0 → dot selalu hijau "ready" walau skill lagi CD → keliatan mati utk semua hero.
            - **Fix**: anchor wall-clock (`steady_clock`) per (entity, spellID, startTime). Entry dictionary muncul pas skill dipake (AddCD), jadi pertama kali lihat entry = awal CD → countdown mundur akurat. Fallback: kalau flag `m_isCoolDown` masih nyala tapi sisa 0, dot tetap merah.

            ### UNIVERSAL — SUPPORT ALL HP + ALL ROM (v1.0)

            ### UNIVERSAL — SUPPORT ALL HP + ALL ROM (v1.0)
            - **Fix crash `Touch_Init` di ROM lain**: sebelumnya `opendir("/dev/input/")` TANPA NULL-check → kalau `/dev/input` ga bisa diakses (SELinux / layout ROM beda) langsung SEGFAULT → tool mati total di HP temen. Sekarang NULL-safe + scan via direktori asli (bukan asumsi event0..N).
            - **Fallback discovery device sentuh via `/proc/bus/input/devices`**: kalau `/dev/input` ga kebaca, parse `/proc/bus/input/devices` buat nemu node event sentuh yg bener — works di ROM yg penomoran event-nya beda / nyembunyiin /dev/input.
            - **uinput dibuat DULU, baru grab device asli**: sebelumnya device di-grab SEBELUM uinput dibuat → kalau `/dev/uinput` gagal, layar sentuh HP ikut MATI TOTAL (game ga bisa disentuh). Sekarang kalau uinput gagal: device asli TIDAK di-grab, game tetap normal, fitur tap sintetik nonaktif + pesan errno jelas.
            - **Log kegagalan jelas**: tiap gagal (device ga ketemu / uinput ga bisa) ada print `[TOUCH] FAILED: ...` dengan errno — ga ada lagi kegagalan senyap.

            ### FIX AUTO-RETRI GA PERNAH KEPENCET (v1.0)
            - **`retriMaxDist` salah skala → fix ke 700 unit dunia asli**: sebelumnya 10.0 (hasil analisis skala minimap yg salah) → retri cuma trigger kalau monster jaraknya <10 unit dunia (nempel banget) = GA PERNAH kepencet. Range retri MLBB asli = 700 unit dunia, sekarang default 700 + slider 50–1500 + **info jarak monster terdekat live** di UI biar bisa diverifikasi.

            ### TOOL DEBUG TOUCH + AUTO-RETRI (v0.9)
            - **Tombol "Test Tap"** di tab Auto Retri: tap 1x di titik retri yg dikalibrasi TANPA perlu nunggu monster. Kalau ini bikin game kepencet → injeksi jalan, masalahnya cuma di deteksi monster. Kalau ga kepencet → masalah di injeksi (errno tampil di layar).
            - **Status Touch live**: Touch OK/FAILED, nama device yg di-grab, jumlah tap-batch & mirror-batch yg berhasil ditulis ke uinput + errno kalau sistem nolak.
            - **Verbose log**: tiap tap ada print `[TOUCH] tap DOWN/UP (x,y) fd bytes errno` + `[RETRI] auto-tap target#...` + baris `[DBG]` tiap ~1.5 detik (BM, players, monsters, camp).
            - **Room Info di-refresh otomatis tiap ~200ms** → data player langsung muncul begitu BattleManager ada (loading screen / awal match).

            ### FITUR BARU — ROOM / PLAYER INFO + DEBUG (v0.8)
            - **Tab Info & Debug**: daftar player live (Biru/sekutu & Merah/musuh) — Hero, Battle Spell, Rank, Level, KDA, Gold, Team name, jarak, penanda `>>` buat diri sendiri. Pemisahan tim pakai `m_EntityCampType` (0xd0).
            - **Debug overlay** (toggle, kiri atas): PID, libbase, BattleManager, jumlah player per tim + monster, FPS, camp, status Safe Mode — tampil juga pas menu di-minimize.
            - Fix buffer overflow `SendTapMove` (ev[5] nulis 6 event → ev[8]).

            ### FIX AKAR MASALAH — TOUCH & AUTO RETRI (v0.7)
            - **`block_untrusted_touches 0` di-set otomatis saat start** — Android 12+ (AOSP 16) memblokir sentuhan uinput sebagai "untrusted" → ini biang keladi "touch ga bisa sama sekali".
            - **uinput device mendaftarkan SEMUA kode ABS** + range dari device asli (sebelumnya kernel nolak batch write karena kode ABS ga terdaftar).
            - **Range ABS_MT_SLOT dipaksa 0..15** supaya tap sintetik slot 12 tidak di-clamp/merge dengan jari asli.
            - **Tap retri langsung dieksekusi** via slot 12 dedicated (tidak nunggu "tangan bersih" — nunggu = ga pernah jalan pas war).

            ### File
            | File | Type | Keterangan |
            |------|------|------------|
            | `panxcz_mlbb` | ELF executable (arm64) | Cheat MLBB (ESP + Auto Retri + Minimap + Drone View + Room Info) |
            | `dump_22.1.97.12061.cs` | Dump reference | Offsets & kelas untuk update berikutnya |

            ### Cara Pakai (MT Manager / Terminal root)
            ```bash
            su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"
            ```

            ### Fix v0.5 -> v0.6 (sebelumnya)
            - **Damage retri formula diganti ke rumus resmi MLBB**: `750 + 150 x level` (Lv1=900, Lv4=1350, Lv5=1500 dst) - bukan rumus lama 600+(lvl-1)x80
            - **Slider Jungle Mult** (default 1.00) buat damage ke monster kena bonus item jungle/blessing + Dmg Bonus tetap ada. Info live nunjukin damage sesuai rumus baru
            - Semua setting baru ikut ke-save otomatis (autosave config)

            - **Auto Retri tap sekarang di slot sentuh TERPISAH (slot 12)** - sebelumnya tap sintetik digabung ke slot 0, jadi pas jempol kiri pegang joystick, tap retri nyatu sama sentuhan joystick -> kaya nyentuh tombol lain / joystick gerak sendiri / retri ga kepencet. Sekarang tap retri jalan di slot sendiri, gak ganggu jari asli
            - **Kalibrasi & pengaturan DISIMPAN otomatis** ke /data/local/tmp/panxcz_mlbb.cfg (autosave ~1.5 detik + pas exit) - minimap angle/scale/pos, dot retri + native coords, Dmg Bonus, tema, bahasa, Safe Mode, dll. Sekali set, gak reset lagi tiap buka
            - **FPS tampil saat menu minimized** (pill nunjukin FPS + status)
            - Pilihan bahasa (English/Indonesia) sinkron dengan yang tersimpan

            ### File
            | File | Type | Keterangan |
            |------|------|------------|
            | `panxcz_mlbb` | ELF executable (arm64) | Cheat MLBB terbaru (ESP + Auto Retri + Minimap + Drone View) |
            | `dump_22.1.97.12061.cs` | Dump reference | Offsets & kelas untuk update berikutnya |

            ### Fix v0.3 -> v0.4 (sebelumnya)
            - Kalibrasi touch 1-tap (Set Dot) - native coords biar tap presisi
            - Teman/sekutu ga di-show (default) + deteksi tim dobel (flag + camp)
            - Safe Mode (default ON) - tidak ada memory write ke game
            - Bahasa 中文 diganti Indonesia (English / Indonesia, default English)

            ### Fix v0.2 -> v0.3 (sebelumnya)
            - Touch passthrough verbatim mirror - gesture quick emote & slide chat natural
            - Auto Retri retry + Dmg Bonus + info live
            - Tombol minimize/exit lebih gede, Volume −/+ kontrol minimize

            ### Fix v0.1 -> v0.2 (sebelumnya)
            - Crash boot (Aborted 134 / Pointer tag truncated) - pointer di-untag sebelum process_vm syscall
            - Bug write memory pvm 4-arg (sekarang benar SYS_process_vm_writev)
            - Ukuran overlay & math minimap (bidang X/Z benar) + kalibrasi live + marker player sendiri
            - Init overlay jalur yang terbukti boot

            ### Offset Source
            - Di-update berdasarkan dump resmi **MLBB 22.1.97.12061**
            - `ShowEntity` / `ShowPlayer` / `BattleManager` / `GameMethod` / `CoolDownData` diverifikasi langsung dari dump

            ### Cara Pakai (MT Manager / Terminal root)
            ```bash
            # Copy ke device root
            su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"
            ```

