name: Build Panxcz cheat mlbb (srcshen)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcshen/**'
      - 'com.mobile.legends_22.1.97.12061.cs'
      - '.github/workflows/build-srcshen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build panxcz_mlbb (ELF arm64)
        run: |
          cd srcshen
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Package
        run: |
          mkdir -p release
          cp srcshen/libs/arm64-v8a/panxcz_mlbb release/panxcz_mlbb 2>/dev/null || true
          chmod 755 release/panxcz_mlbb 2>/dev/null || true
          cp com.mobile.legends_22.1.97.12061.cs release/dump_22.1.97.12061.cs 2>/dev/null || true
          ls -la release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-mlbb
          path: release/

      - name: Create pre-release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: "Panxcz cheat mlbb v1.2 pre release"
          prerelease: true
          body: |
            ## Panxcz cheat mlbb v1.2 pre release

            ### HOTFIX — LAYOUT SKILL CD + MAPPING SLOT (v1.2)
            - **CD dipindah ke KANAN hero** (kolom terpisah dari bar HP/MP) — sebelumnya dot & angka CD numpuk di area bar + semua angka di satu titik → susah dibedain.
            - **Tiap skill punya kolom sendiri**: label S1/S2/ULT + dot (hijau=ready, merah=CD) + angka sisa CD di bawah dot-NYA masing-masing.
            - **Mapping slot akurat**: pakai `_dicSkillCnf` (daftar skill asli hero) biar spell yang lagi CD ke-taruh di kolom yang bener (dulu kalau cuma ULT yg CD, ke-label S1).


            ### HOTFIX — SKILL CD GA KELIATAN (v1.1)
            - **Akar masalah**: sisa CD dihitung pakai `time(nullptr)*1000` (epoch wall-clock ~1.7 triliun) padahal `uiStartTime/uiCoolTime` itu **jam internal battle** (nilai kecil). `elapsed = now - startTime` selalu raksasa → sisa selalu 0 → dot selalu hijau "ready" walau skill lagi CD → keliatan mati utk semua hero.
            - **Fix**: anchor wall-clock (`steady_clock`) per (entity, spellID, startTime). Entry dictionary muncul pas skill dipake (AddCD), jadi pertama kali lihat entry = awal CD → countdown mundur akurat. Fallback: kalau flag `m_isCoolDown` masih nyala tapi sisa 0, dot tetap merah.

            ### UNIVERSAL — SUPPORT ALL HP + ALL ROM (v1.0)

            ### UNIVERSAL — SUPPORT ALL HP + ALL ROM (v1.0)
            - **Fix crash `Touch_Init` di ROM lain**: sebelumnya `opendir("/dev/input/")` TANPA NULL-check → kalau `/dev/input` ga bisa diakses (SELinux / layout ROM beda) langsung SEGFAULT → tool mati total di HP temen. Sekarang NULL-safe + scan via direktori asli (bukan asumsi event0..N).
            - **Fallback discovery device sentuh via `/proc/bus/input/devices`**: kalau `/dev/input` ga kebaca, parse `/proc/bus/input/devices` buat nemu node event sentuh yg bener — works di ROM yg penomoran event-nya beda / nyembunyiin /dev/input.
            - **uinput dibuat DULU, baru grab device asli**: sebelumnya device di-grab SEBELUM uinput dibuat → kalau `/dev/uinput` gagal, layar sentuh HP ikut MATI TOTAL (game ga bisa disentuh). Sekarang kalau uinput gagal: device asli TIDAK di-grab, game tetap normal, fitur tap sintetik nonaktif + pesan errno jelas.
            - **Log kegagalan jelas**: tiap gagal (device ga ketemu / uinput ga bisa) ada print `[TOUCH] FAILED: ...` dengan errno — ga ada lagi kegagalan senyap.

            ### FIX AUTO-RETRI GA PERNAH KEPENCET (v1.0)
            - **`retriMaxDist` salah skala → fix ke 700 unit dunia asli**: sebelumnya 10.0 (hasil analisis skala minimap yg salah) → retri cuma trigger kalau monster jaraknya <10 unit dunia (nempel banget) = GA PERNAH kepencet. Range retri MLBB asli = 700 unit dunia, sekarang default 700 + slider 50–1500 + **info jarak monster terdekat live** di UI biar bisa diverifikasi.

            ### TOOL DEBUG TOUCH + AUTO-RETRI (v0.9)
            - **Tombol "Test Tap"** di tab Auto Retri: tap 1x di titik retri yg dikalibrasi TANPA perlu nunggu monster. Kalau ini bikin game kepencet → injeksi jalan, masalahnya cuma di deteksi monster. Kalau ga kepencet → masalah di injeksi (errno tampil di layar).
            - **Status Touch live**: Touch OK/FAILED, nama device yg di-grab, jumlah tap-batch & mirror-batch yg berhasil ditulis ke uinput + errno kalau sistem nolak.
            - **Verbose log**: tiap tap ada print `[TOUCH] tap DOWN/UP (x,y) fd bytes errno` + `[RETRI] auto-tap target#...` + baris `[DBG]` tiap ~1.5 detik (BM, players, monsters, camp).
            - **Room Info di-refresh otomatis tiap ~200ms** → data player langsung muncul begitu BattleManager ada (loading screen / awal match).

            ### FITUR BARU — ROOM / PLAYER INFO + DEBUG (v0.8)
            - **Tab Info & Debug**: daftar player live (Biru/sekutu & Merah/musuh) — Hero, Battle Spell, Rank, Level, KDA, Gold, Team name, jarak, penanda `>>` buat diri sendiri. Pemisahan tim pakai `m_EntityCampType` (0xd0).
            - **Debug overlay** (toggle, kiri atas): PID, libbase, BattleManager, jumlah player per tim + monster, FPS, camp, status Safe Mode — tampil juga pas menu di-minimize.
            - Fix buffer overflow `SendTapMove` (ev[5] nulis 6 event → ev[8]).

            ### FIX AKAR MASALAH — TOUCH & AUTO RETRI (v0.7)
            - **`block_untrusted_touches 0` di-set otomatis saat start** — Android 12+ (AOSP 16) memblokir sentuhan uinput sebagai "untrusted" → ini biang keladi "touch ga bisa sama sekali".
            - **uinput device mendaftarkan SEMUA kode ABS** + range dari device asli (sebelumnya kernel nolak batch write karena kode ABS ga terdaftar).
            - **Range ABS_MT_SLOT dipaksa 0..15** supaya tap sintetik slot 12 tidak di-clamp/merge dengan jari asli.
            - **Tap retri langsung dieksekusi** via slot 12 dedicated (tidak nunggu "tangan bersih" — nunggu = ga pernah jalan pas war).

            ### File
            | File | Type | Keterangan |
            |------|------|------------|
            | `panxcz_mlbb` | ELF executable (arm64) | Cheat MLBB (ESP + Auto Retri + Minimap + Drone View + Room Info) |
            | `dump_22.1.97.12061.cs` | Dump reference | Offsets & kelas untuk update berikutnya |

            ### Cara Pakai (MT Manager / Terminal root)
            ```bash
            su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"
            ```

            ### Fix v0.5 -> v0.6 (sebelumnya)
            - **Damage retri formula diganti ke rumus resmi MLBB**: `750 + 150 x level` (Lv1=900, Lv4=1350, Lv5=1500 dst) - bukan rumus lama 600+(lvl-1)x80
            - **Slider Jungle Mult** (default 1.00) buat damage ke monster kena bonus item jungle/blessing + Dmg Bonus tetap ada. Info live nunjukin damage sesuai rumus baru
            - Semua setting baru ikut ke-save otomatis (autosave config)

            - **Auto Retri tap sekarang di slot sentuh TERPISAH (slot 12)** - sebelumnya tap sintetik digabung ke slot 0, jadi pas jempol kiri pegang joystick, tap retri nyatu sama sentuhan joystick -> kaya nyentuh tombol lain / joystick gerak sendiri / retri ga kepencet. Sekarang tap retri jalan di slot sendiri, gak ganggu jari asli
            - **Kalibrasi & pengaturan DISIMPAN otomatis** ke /data/local/tmp/panxcz_mlbb.cfg (autosave ~1.5 detik + pas exit) - minimap angle/scale/pos, dot retri + native coords, Dmg Bonus, tema, bahasa, Safe Mode, dll. Sekali set, gak reset lagi tiap buka
            - **FPS tampil saat menu minimized** (pill nunjukin FPS + status)
            - Pilihan bahasa (English/Indonesia) sinkron dengan yang tersimpan

            ### File
            | File | Type | Keterangan |
            |------|------|------------|
            | `panxcz_mlbb` | ELF executable (arm64) | Cheat MLBB terbaru (ESP + Auto Retri + Minimap + Drone View) |
            | `dump_22.1.97.12061.cs` | Dump reference | Offsets & kelas untuk update berikutnya |

            ### Fix v0.3 -> v0.4 (sebelumnya)
            - Kalibrasi touch 1-tap (Set Dot) - native coords biar tap presisi
            - Teman/sekutu ga di-show (default) + deteksi tim dobel (flag + camp)
            - Safe Mode (default ON) - tidak ada memory write ke game
            - Bahasa 中文 diganti Indonesia (English / Indonesia, default English)

            ### Fix v0.2 -> v0.3 (sebelumnya)
            - Touch passthrough verbatim mirror - gesture quick emote & slide chat natural
            - Auto Retri retry + Dmg Bonus + info live
            - Tombol minimize/exit lebih gede, Volume −/+ kontrol minimize

            ### Fix v0.1 -> v0.2 (sebelumnya)
            - Crash boot (Aborted 134 / Pointer tag truncated) - pointer di-untag sebelum process_vm syscall
            - Bug write memory pvm 4-arg (sekarang benar SYS_process_vm_writev)
            - Ukuran overlay & math minimap (bidang X/Z benar) + kalibrasi live + marker player sendiri
            - Init overlay jalur yang terbukti boot

            ### Offset Source
            - Di-update berdasarkan dump resmi **MLBB 22.1.97.12061**
            - `ShowEntity` / `ShowPlayer` / `BattleManager` / `GameMethod` / `CoolDownData` diverifikasi langsung dari dump

            ### Cara Pakai (MT Manager / Terminal root)
            ```bash
            # Copy ke device root
            su -c "chmod 755 /data/local/tmp/panxcz_mlbb && /data/local/tmp/panxcz_mlbb"
            ```

            ### Fitur
            - ESP Player (line, icon hero, HP bar, MP bar, skill CD musuh)
            - ESP Monster/Minion + alert Lord/Turtle diserang
            - Auto Retribution (Lord/Turtle/Buff/Crab/Lito) + set posisi tombol
            - Minimap ESP (icon hero + marker sendiri + ring merah)
            - Drone View (FOV camera)
            - Multi theme (Neon Dark / Light / Classic), EN + 中文

            **Educational purposes only.** By Panxcz & Freebuff.
          files: release/*
          fail_on_unmatched_files: false
